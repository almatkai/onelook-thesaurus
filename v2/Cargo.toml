[package]
name = "tezbar-onelook-thesaurus"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2", version = "=0.1.1" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "io-std", "fs"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
uuid = { version = "=1.23.3", features = ["v4"] }

[features]
qa = []

[[bin]]
name = "onelook-thesaurus"
path = "src/main.rs"

[[bin]]
name = "onelook-qa"
path = "src/bin/qa.rs"
required-features = ["qa"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
